const all = [...el.children];
all.forEach(c=>{
  if(MARK[c.dataset.ch]) c.classList.add(MARK[c.dataset.ch]==1?"mlike":"mhate");
  c.addEventListener("click",ev=>{
    const cur = MARK[c.dataset.ch]||0;
    const next = cur===0?1:cur===1?2:0;
    c.classList.remove("mlike","mhate");
    if(next===1){c.classList.add("mlike");MARK[c.dataset.ch]=1}
    else if(next===2){c.classList.add("mhate");MARK[c.dataset.ch]=2}
    else delete MARK[c.dataset.ch];
    localStorage.setItem("ziMark", JSON.stringify(MARK));
    render(); stat();
  });
});
const gW=document.getElementById("gWater"), gM=document.getElementById("gWood");
function render(){
  gW.innerHTML=""; gM.innerHTML="";
  const q=document.getElementById("q").value.trim().toLowerCase();
  const v=document.querySelector(".chip.fv.on")?.dataset.v ?? "";
  const w=document.querySelector(".chip.fw.on")?.dataset.w ?? "";
  const m=document.querySelector(".chip.pri.on")?.dataset.m ?? "";
  const hideR=document.getElementById("hideRisk").classList.contains("on");
  const hideU=document.getElementById("hideUsed").classList.contains("on");
  let cw=0,cm=0;
  for(const c of all){
    if(q && !(c.dataset.py.includes(q)||c.dataset.ch.includes(q))) continue;
    if(v && !c.dataset.vibes.split("|").includes(v)) continue;
    if(w && !c.className.includes("wx"+w)) continue;
    const mk=MARK[c.dataset.ch]||0;
    if(m==="like"&&mk!==1) continue;
    if(m==="none"&&mk!==0) continue;
    if(hideR&&c.dataset.risk==="1") continue;
    if(hideU&&c.dataset.used==="1") continue;
    if(c.className.includes("wx水")){gW.appendChild(c);cw++}else{gM.appendChild(c);cm++}
  }
  document.querySelector("#hWater .n").textContent="（"+cw+" 字）";
  document.querySelector("#hWood .n").textContent="（"+cm+" 字）";
}
function stat(){
  const l=Object.entries(MARK).filter(([,v])=>v===1).map(([k])=>k);
  const h=Object.entries(MARK).filter(([,v])=>v===2).map(([k])=>k);
  document.getElementById("stat").textContent="✓"+l.length+" ✗"+h.length;
}

    document.getElementById("out").value="喜欢的字："+l.join("")+"\n不喜欢的字："+h.join("");

  if(ch.classList.contains("fw")){document.querySelectorAll(".chip.fw").forEach(x=>x.classList.remove("on"))}
